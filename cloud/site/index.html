<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="言序 KnowGrove 云端账户与 Credit 管理" />
    <title>言序 · KnowGrove</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="brand-panel">
        <div class="brand-mark" aria-hidden="true">言</div>
        <p class="eyebrow">KNOWGROVE CLOUD</p>
        <h1>让知识有序生长</h1>
        <p class="brand-copy">
          用邮箱登录言序，在 Obsidian 与云端之间安全同步账户、Credit 和 AI
          能力。
        </p>
        <ul>
          <li>只支持邮箱注册与登录</li>
          <li>Credit 账本可追溯、可对账</li>
          <li>插件通过设备授权连接，不保存密码</li>
        </ul>
      </section>

      <section class="account-panel">
        <div id="loading" class="state-card">正在检查登录状态…</div>

        <section id="auth-view" class="auth-view" hidden>
          <div class="tabs" role="tablist" aria-label="账户操作">
            <button class="tab is-active" type="button" data-mode="signin">
              登录
            </button>
            <button class="tab" type="button" data-mode="signup">注册</button>
          </div>

          <div class="auth-heading">
            <h2 id="form-title">邮箱登录</h2>
            <p id="form-description">登录后可查看 Credit 和设备连接状态。</p>
          </div>

          <form id="auth-form">
            <label id="name-field" hidden>
              <span>称呼</span>
              <input
                id="name"
                name="name"
                autocomplete="name"
                placeholder="你的称呼"
              />
            </label>
            <label>
              <span>邮箱</span>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="name@example.com"
              />
            </label>
            <label>
              <span>密码</span>
              <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                autocomplete="current-password"
                required
                placeholder="至少 8 位"
              />
            </label>
            <p id="auth-message" class="message" role="status"></p>
            <button id="auth-submit" class="primary" type="submit">登录</button>
          </form>

          <button id="forgot-password" class="text-button" type="button">
            忘记密码
          </button>
        </section>

        <section id="otp-view" class="auth-view" hidden>
          <div class="auth-heading">
            <p class="eyebrow">邮箱验证</p>
            <h2 id="otp-title">输入 6 位验证码</h2>
            <p id="otp-description"></p>
          </div>
          <form id="otp-form">
            <label>
              <span>验证码</span>
              <input
                id="otp"
                name="otp"
                inputmode="numeric"
                autocomplete="one-time-code"
                minlength="6"
                maxlength="6"
                required
                placeholder="000000"
              />
            </label>
            <label id="new-password-field" hidden>
              <span>新密码</span>
              <input
                id="new-password"
                name="newPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                placeholder="至少 8 位"
              />
            </label>
            <p id="otp-message" class="message" role="status"></p>
            <button class="primary" type="submit">确认</button>
          </form>
          <button id="back-to-login" class="text-button" type="button">
            返回登录
          </button>
        </section>

        <section id="dashboard-view" class="dashboard" hidden>
          <div class="dashboard-header">
            <div>
              <p class="eyebrow">账户已连接</p>
              <h2 id="user-email"></h2>
            </div>
            <button id="sign-out" class="secondary" type="button">退出</button>
          </div>

          <div class="credit-card">
            <span>可用 Credit</span>
            <strong id="credit-available">—</strong>
            <p>
              预留 <b id="credit-reserved">—</b> · 已使用
              <b id="credit-consumed">—</b>
            </p>
          </div>

          <div id="development-tools" class="development-tools" hidden>
            <p>开发环境模拟：充值 2,800 Credit，验证订单与账本闭环。</p>
            <button id="simulate-purchase" class="primary" type="button">
              模拟充值
            </button>
          </div>
          <p id="dashboard-message" class="message" role="status"></p>
        </section>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
