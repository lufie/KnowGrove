<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>言序 · KnowGrove 剪藏</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="brand-row">
        <div>
          <p class="eyebrow">KNOWGROVE CAPTURE</p>
          <h1>言序</h1>
        </div>
        <button id="open-options" class="icon-button" type="button" aria-label="打开设置">设置</button>
      </header>

      <section class="page-card" aria-labelledby="page-title">
        <div class="page-card-top">
          <span id="page-type" class="type-pill">识别中</span>
          <span id="bridge-state" class="bridge-state">连接中</span>
        </div>
        <h2 id="page-title">正在读取当前页面…</h2>
        <p id="skill-name" class="skill-name">正在匹配内置 Skill…</p>
        <p id="page-url" class="page-url"></p>
      </section>

      <section class="controls">
        <div class="engine-row">
          <span>KnowGrove 处理引擎</span>
          <strong id="provider">读取中</strong>
        </div>
        <button id="capture" class="primary-button" type="button" disabled>
          一键整理到 Obsidian
        </button>
      </section>

      <section id="progress-panel" class="progress-panel" hidden>
        <div class="progress-heading">
          <span id="progress-dot" class="progress-dot"></span>
          <strong id="progress-title">正在创建任务</strong>
        </div>
        <p id="progress-message">准备提取当前页面。</p>
        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          aria-label="任务进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span id="progress-bar" class="progress-bar"></span>
        </div>
        <span id="progress-value" class="progress-value">0%</span>
        <button id="cancel-job" class="cancel-button" type="button">取消并清理</button>
      </section>

      <section id="result-panel" class="result-panel" hidden>
        <p id="result-label" class="result-label">已保存</p>
        <h3 id="result-title"></h3>
        <p id="result-preview"></p>
        <p id="result-path" class="result-path"></p>
        <div class="result-actions">
          <button id="open-obsidian" class="primary-button compact" type="button">在 Obsidian 打开</button>
          <button id="copy-path" class="secondary-button compact" type="button">复制路径</button>
        </div>
      </section>

      <section id="error-panel" class="error-panel" hidden>
        <strong>这次没有完成</strong>
        <p id="error-message"></p>
        <div class="result-actions">
          <button id="connect" class="primary-button compact" type="button" hidden>连接 KnowGrove</button>
          <button id="browser-session" class="primary-button compact" type="button" hidden>允许当前站点并重试</button>
          <button id="public-capture" class="secondary-button compact" type="button" hidden>使用公开解析</button>
          <button id="retry" class="secondary-button compact" type="button">重试</button>
        </div>
      </section>

      <footer>
        <span>内容只交给本机 KnowGrove</span>
        <span id="auto-run-note"></span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
